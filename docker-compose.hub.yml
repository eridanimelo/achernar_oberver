# Achernar Observer — run from published images (no git clone, no build).
#
#   mkdir achernar-observer && cd achernar-observer
#   curl -o docker-compose.yml https://raw.githubusercontent.com/eridanimelo/achernar_oberver/master/docker-compose.hub.yml
#   mkdir -p otel && curl -o otel/otel-collector-config.yaml https://raw.githubusercontent.com/eridanimelo/achernar_oberver/master/otel/otel-collector-config.yaml
#   docker compose up -d
#   docker compose ps
#
# Dashboard: http://localhost:18180 · API: http://localhost:18080 · OTLP: http://localhost:4318
#
# All ports, passwords and image tags have sensible defaults and can be
# overridden with environment variables (e.g. BACKEND_IMAGE, FRONTEND_PORT).
# To run another release, replace the :2.2.1 tags below.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-achernar_observer}
      POSTGRES_USER: ${POSTGRES_USER:-achernar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-achernar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - observer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-achernar} -d ${POSTGRES_DB:-achernar_observer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-eridani/achernar-observer-backend:2.2.1}
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-2.2.1}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-achernar_observer}
      DATABASE_USERNAME: ${POSTGRES_USER:-achernar}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-achernar}
      OBSERVER_DEFAULT_PROJECT: ${OBSERVER_DEFAULT_PROJECT:-UNKNOWN}
      OBSERVER_CAPTURE_PAYLOADS: ${OBSERVER_CAPTURE_PAYLOADS:-true}
      OBSERVER_CAPTURE_HEADERS: ${OBSERVER_CAPTURE_HEADERS:-true}
      OBSERVER_REDACT_SECRETS: ${OBSERVER_REDACT_SECRETS:-true}
      OBSERVER_UPSTREAM: ${OBSERVER_UPSTREAM:-http://localhost:4000}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://backend:8080/otel}
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_PORT:-4318}:4318"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-eridani/achernar-observer-frontend:2.2.1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18180}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  observer_postgres:
