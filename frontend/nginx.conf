# O nome `backend` só existe no DNS interno do docker compose (127.0.0.11).
# Usar variável + resolver adia a resolução para runtime: o nginx sobe
# mesmo que o backend ainda não esteja no ar (ex.: primeira subida).
server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Alvo do healthcheck do docker compose
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SSE (/api/stream): sem buffer e com timeouts longos,
    # senão o nginx segura os eventos e o dashboard não atualiza
    location = /api/stream {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # O bundle se chama main.js SEM hash (build development): sem isso o
        # browser reaproveita o JS antigo após atualizar a imagem e a UI nova
        # (ex.: checkbox Sessão completa) nunca aparece. Revalida a cada load.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
