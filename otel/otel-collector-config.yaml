receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  otlphttp/observer:
    # Definido pelo compose (OTEL_EXPORTER_ENDPOINT).
    # Dentro do compose: http://backend:8080/otel
    # Backend rodando fora do docker: http://host.docker.internal:8080/otel
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    encoding: json
    compression: none
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/observer]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/observer]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/observer]